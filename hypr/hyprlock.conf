source = ./themes/latte.conf

$font = FiraCode Nerd Font

general {
  hide_cursor = true
}

background {
  monitor =
  path = ~/.config/bgs/broken-covenant-riven.jpg
  blur_passes = 2
  color = $base
}

label {
  monitor =
  text = $TIME
  color = $base
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $base
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

label {
  monitor =
  text = Welcome $USER
  font_family = $font
  color = $mauve
  halign = center
  valign = center
}

image {
  monitor =
  path = ~/.config/bgs/riven-face.jpg
  size = 100
  border_color = $mauve
  position = 0, 75
  halign = center
  valign = center
}

input-field {
  monitor = 
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $mauve
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Type Password... </i></span>
  hide_input = false
  check_color = $mauve
  fail_color = $red
  fail_text = <i> Incorrect Password </i>
  capslock_color = $yellow
  position = 0, -48
  halign = center
  valign = center
}

shape {
  monitor =
  size = 3000, 3
  color = $mauve
  rounding = 10
  position = 540, -48
  halign = center
  valign = center
}
